name: Check links

# Websites die over time, check weekly instead of blocking every build on the internet
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  links:
    name: Links in the book
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: compiler

    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: compiler/.nvmrc

      # The checker only needs node built-ins
      - name: Check links
        run: npm run links
